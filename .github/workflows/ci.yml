name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: "${{ matrix.project }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - 01-predictive-maintenance
          - 02-process-optimizer
          - 03-energy-auditor
          - 04-supply-chain-optimizer
          - 05-vision-inspector
          - 06-digital-twin
          - 07-doc-intelligence
          - 08-fleet-tracker
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "${{ matrix.project }}/requirements*.txt"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download spaCy model (07-doc-intelligence only)
        if: matrix.project == '07-doc-intelligence'
        run: python -m spacy download en_core_web_sm

      - name: Run tests
        run: pytest -q
