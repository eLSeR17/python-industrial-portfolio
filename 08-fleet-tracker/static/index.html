<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fleet & Asset Tracker</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        #header {
            background: #1a1a2e; color: #e94560; padding: 12px 20px;
            display: flex; justify-content: space-between; align-items: center;
        }
        #header h1 { font-size: 18px; font-weight: 600; }
        #status { font-size: 13px; color: #0f3460; }
        #status.connected { color: #00c853; }
        #status.disconnected { color: #ff5252; }
        #map { height: calc(100vh - 50px); width: 100%; }
        #legend {
            position: absolute; bottom: 20px; left: 20px; z-index: 1000;
            background: rgba(255,255,255,0.95); border-radius: 8px;
            padding: 12px 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        #legend h3 { font-size: 12px; margin-bottom: 8px; color: #333; }
        .legend-item { display: flex; align-items: center; gap: 8px; margin: 4px 0; font-size: 12px; }
        .legend-dot { width: 10px; height: 10px; border-radius: 50%; }
        #panel {
            position: absolute; top: 60px; right: 10px; z-index: 1000;
            background: rgba(255,255,255,0.95); border-radius: 8px;
            padding: 12px 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            max-width: 220px; font-size: 12px;
        }
        #panel .stat { margin: 4px 0; }
        #panel .stat span { font-weight: 600; }
    </style>
</head>
<body>
    <div id="header">
        <h1>Fleet &amp; Asset Tracker</h1>
        <span id="status" class="disconnected">Offline</span>
    </div>
    <div id="map"></div>
    <div id="legend">
        <h3>Asset Status</h3>
        <div class="legend-item"><div class="legend-dot" style="background:#00c853"></div> Active</div>
        <div class="legend-item"><div class="legend-dot" style="background:#ffc107"></div> Idle</div>
        <div class="legend-item"><div class="legend-dot" style="background:#ff5252"></div> Maintenance</div>
        <div class="legend-item"><div class="legend-dot" style="background:#9e9e9e"></div> Offline</div>
    </div>
    <div id="panel">
        <div class="stat">Assets: <span id="totalAssets">0</span></div>
        <div class="stat">Active: <span id="activeAssets">0</span></div>
        <div class="stat">Utilization: <span id="avgUtil">0%</span></div>
        <div class="stat">Alerts: <span id="alertCount">0</span></div>
    </div>
    <script>
        const map = L.map('map').setView([40.7128, -74.006], 16);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        const STATUS_COLORS = {
            ACTIVE: '#00c853', IDLE: '#ffc107',
            MAINTENANCE: '#ff5252', OFFLINE: '#9e9e9e'
        };
        const ZONE_COLORS = {
            WAREHOUSE: '#1565c0', RESTRICTED: '#c62828',
            CHARGING: '#2e7d32', PARKING: '#6a1b9a'
        };

        let markers = {};
        let trails = {};
        let geofences = [];
        let ws = null;

        function statusColor(status) { return STATUS_COLORS[status] || '#9e9e9e'; }

        function createIcon(color) {
            return L.divIcon({
                className: '', iconSize: [14, 14], iconAnchor: [7, 7],
                html: `<div style="width:14px;height:14px;border-radius:50%;background:${color};
                       border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,0.4)"></div>`
            });
        }

        async function loadAssets() {
            try {
                const resp = await fetch('/api/v1/assets');
                const assets = await resp.json();
                let active = 0;
                assets.forEach(a => {
                    if (a.latitude == null || a.longitude == null) return;
                    const color = statusColor(a.status);
                    if (a.status === 'ACTIVE') active++;
                    if (markers[a.id]) {
                        markers[a.id].setLatLng([a.latitude, a.longitude]).setIcon(createIcon(color));
                    } else {
                        markers[a.id] = L.marker([a.latitude, a.longitude], { icon: createIcon(color) })
                            .addTo(map).bindPopup(`<b>${a.name}</b><br>${a.asset_type}<br>Status: ${a.status}`);
                    }
                });
                document.getElementById('totalAssets').textContent = assets.length;
                document.getElementById('activeAssets').textContent = active;
            } catch (e) { console.warn('Could not load assets:', e); }
        }

        async function loadGeofences() {
            try {
                const resp = await fetch('/api/v1/geofences');
                const fences = await resp.json();
                fences.forEach(f => {
                    const color = ZONE_COLORS[f.zone_type] || '#1565c0';
                    let layer;
                    if (f.fence_type === 'POLYGON') {
                        const latlngs = f.coordinates.map(c => [c[0], c[1]]);
                        layer = L.polygon(latlngs, { color, weight: 2, fillOpacity: 0.1 })
                            .bindPopup(`<b>${f.name}</b><br>${f.zone_type}`);
                    } else if (f.fence_type === 'CIRCLE') {
                        const c = f.coordinates[0];
                        layer = L.circle([c.lat, c.lon], { radius: c.radius_m, color, weight: 2, fillOpacity: 0.1 })
                            .bindPopup(`<b>${f.name}</b><br>${f.zone_type}`);
                    }
                    if (layer) { layer.addTo(map); geofences.push(layer); }
                });
            } catch (e) { console.warn('Could not load geofences:', e); }
        }

        async function loadDashboard() {
            try {
                const resp = await fetch('/api/v1/dashboard');
                const stats = await resp.json();
                document.getElementById('totalAssets').textContent = stats.total_assets;
                document.getElementById('activeAssets').textContent = stats.active_assets;
                document.getElementById('avgUtil').textContent = stats.avg_utilization.toFixed(1) + '%';
                document.getElementById('alertCount').textContent = stats.alerts_count;
            } catch (e) { console.warn('Dashboard unavailable'); }
        }

        function connectWS() {
            const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${proto}//${location.host}/ws/tracking`);
            ws.onopen = () => {
                document.getElementById('status').textContent = 'Live';
                document.getElementById('status').className = 'connected';
            };
            ws.onclose = () => {
                document.getElementById('status').textContent = 'Offline';
                document.getElementById('status').className = 'disconnected';
                setTimeout(connectWS, 3000);
            };
            ws.onmessage = (e) => {
                try {
                    const d = JSON.parse(e.data);
                    if (d.type === 'location_update') {
                        const color = d.is_moving ? '#00c853' : '#ffc107';
                        if (markers[d.asset_id]) {
                            markers[d.asset_id].setLatLng([d.latitude, d.longitude]).setIcon(createIcon(color));
                        }
                        if (!trails[d.asset_id]) {
                            trails[d.asset_id] = L.polyline([], { color, weight: 2, opacity: 0.6 }).addTo(map);
                        }
                        trails[d.asset_id].addLatLng([d.latitude, d.longitude]);
                    }
                } catch (err) {}
            };
        }

        loadGeofences();
        loadAssets();
        loadDashboard();
        connectWS();
        setInterval(() => { loadAssets(); loadDashboard(); }, 10000);
    </script>
</body>
</html>
