services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      FLEET_DATABASE_URL: "sqlite+aiosqlite:///./fleet_tracker.db"
      FLEET_REDIS_URL: "redis://redis:6379/0"
      FLEET_DEBUG: "true"
    volumes:
      - app-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/dashboard')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  app-data:

networks:
  default:
    name: fleet-tracker-net
