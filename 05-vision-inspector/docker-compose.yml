services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      VISION_MODEL_PATH: ""
      VISION_DEBUG: "false"
      VISION_HOST: "0.0.0.0"
      VISION_PORT: "8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - vision-net

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - redis-data:/data
    networks:
      - vision-net

volumes:
  redis-data:

networks:
  vision-net:
    driver: bridge
